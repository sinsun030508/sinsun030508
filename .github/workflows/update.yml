name: Update profile stats

on:
  schedule:
    - cron: "23 15 * * *"   # 매일 00:23 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: [gen.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gen.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --staged --quiet; then
            echo "통계 변화 없음"
            exit 0
          fi
          # README 이미지 주소의 ?v= 값을 바꿔서 GitHub 이미지 캐시를 무효화
          sed -i -E "s/(_mode\.svg)(\?v=[0-9]+)?\"/\1?v=$(date +%s)\"/g" README.md
          git add README.md
          git commit -m "chore: refresh profile stats"
          git push
